<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Curse — Wiki</title>
<style>
/*POLICE*/
:root{--bg:#0b0a12;--panel:#14111e;--panel2:#1c1829;--line:#3a3650;--gold:#e8b04a;--txt:#e8e4f0;--muted:#9e96b8;--green:#7ed957;--violet:#a45be8}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--txt);font-family:"DotGothic16",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;background:radial-gradient(1200px 500px at 50% -120px,#2a1a4a 0,transparent 70%),var(--bg);min-height:100vh}
img{image-rendering:pixelated}
a{color:var(--gold)}
header{padding:28px 16px 14px;text-align:center}
header h1{margin:0;font-size:44px;letter-spacing:2px;color:var(--gold);text-shadow:4px 4px 0 #000}
header p{margin:6px 0 0;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;background:rgba(11,10,18,.95);border-block:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 12px}
nav button,.chip{font:inherit;color:var(--txt);background:var(--panel2);border:2px solid var(--line);padding:6px 12px;cursor:pointer}
nav button.on{border-color:var(--gold);color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold)}
nav input{font:inherit;color:var(--txt);background:#0b0a12;border:2px solid var(--line);padding:6px 10px;min-width:180px}
nav input:focus,nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
section[hidden]{display:none}
h2{color:var(--gold);font-size:26px;margin:22px 0 8px;text-shadow:3px 3px 0 #000}
h3{font-size:19px;margin:20px 0 8px;padding-left:10px;border-left:4px solid var(--violet)}
p.intro{color:var(--muted);margin:0 0 12px;max-width:75ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:2px solid var(--line);padding:10px 12px;box-shadow:4px 4px 0 #000}
.card h4{margin:0 0 2px;font-size:17px;color:var(--gold)}
.card .sub{color:var(--muted);font-size:13px}
.mon{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.mon img{width:64px;height:64px;object-fit:contain}
.mon.boss{border-color:var(--gold)}
img.tir{width:24px;height:24px;vertical-align:middle}
.etape{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.25fr);gap:16px;align-items:center;margin-bottom:12px}.etape h3{margin:0 0 6px;border:0;padding:0;color:var(--gold)}.etape p{margin:0;max-width:60ch}.etape p b{color:#fff}.etape figure{margin:0}.etape figure img{width:100%;height:auto;display:block;border:2px solid var(--line);image-rendering:auto}
@media (max-width:760px){.etape{grid-template-columns:1fr}}
.barre{display:grid;grid-template-columns:40px 130px 1fr 64px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}.barre:last-child{border-bottom:0}.barre img{width:36px;height:36px;grid-row:1/3}.barre b{color:var(--gold)}.barre span{text-align:right;color:var(--green)}.barre small{grid-column:2/5;color:var(--muted);font-size:12px}
.jauge{height:16px;background:#0b0a12;border:2px solid var(--line)}.jauge i{display:block;height:100%;background:linear-gradient(90deg,#6a3ad0,#a45be8)}
@media (max-width:560px){.barre{grid-template-columns:40px 1fr 60px}.barre .jauge{grid-column:2/4}.barre small{grid-column:2/4}}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px dotted var(--line);padding-top:2px;margin-top:2px}
.kv span:last-child{color:var(--green);text-align:right}
.rowi{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:6px 10px;margin-bottom:6px}
.rowi .n b{display:block}.rowi .n span{color:var(--muted);font-size:12px}
.ics{display:flex;flex-wrap:wrap;gap:5px}
.ic{position:relative;width:46px;height:46px;background:#0b0a12;border:2px solid var(--line);padding:3px;cursor:help}
.ic img{width:100%;height:100%}
.ic i{position:absolute;right:1px;bottom:0;font-style:normal;font-size:10px;color:var(--muted);text-shadow:1px 1px 0 #000}
#tip{position:fixed;z-index:20;max-width:300px;background:#14111e;border:2px solid var(--gold);box-shadow:4px 4px 0 #000;padding:8px 10px;font-size:13px;pointer-events:none;line-height:1.35}
#tip b{display:block;font-size:15px}#tip .d{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}#tip div{display:flex;justify-content:space-between;gap:14px}#tip div span:last-child:not(:first-child){color:var(--green);white-space:nowrap}
table{border-collapse:collapse;width:100%;background:var(--panel);border:2px solid var(--line)}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:400;background:var(--panel2)}
td.r,th.r{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.dot{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border:1px solid #000}
.vide{color:var(--muted);padding:20px;text-align:center}
footer{color:var(--muted);text-align:center;font-size:13px;padding:0 16px 30px}
@media (max-width:560px){header h1{font-size:32px}.rowi{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>THE CURSE · WIKI</h1><p id="sous"></p></header>
<nav id="nav" aria-label="Rubriques"><input id="q" type="search" placeholder="Rechercher…" aria-label="Rechercher dans la rubrique"></nav>
<main id="main"></main>
<footer>Page générée automatiquement à partir du jeu : les chiffres sont ceux du serveur. <a href="/">Retour au jeu</a></footer>
<div id="tip" hidden></div>
<script>
const D="__DONNEES__";
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pct=v=>(v*100>=10?Math.round(v*100):Math.round(v*1000)/10).toString().replace('.',',')+' %',sur=v=>'1 sur '+Math.round(1/v);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nomMon=k=>(D.monstres.find(m=>m.k===k)||{nom:k}).nom;
$('#sous').textContent='Tout sur les objets, les monstres, les zones et les donjons · '+D.ver+' · mis à jour le '+D.date.split('-').reverse().join('/');
const RUB=[['debuter','Bien débuter'],['objets','Objets'],['monstres','Monstres'],['zones','Zones'],['donjons','Donjons'],['butin','Butin et taux'],['classes','Héros'],['joues','Héros joués'],['poissons','Pêche'],['classement','Classement']];
const main=$('#main'),nav=$('#nav'),S={};
for(const [id,nom] of RUB){const b=el('button',null,nom);b.type='button';b.dataset.r=id;nav.insertBefore(b,$('#q'));S[id]=el('section');S[id].id=id;S[id].hidden=true;main.append(S[id]);}
function montrer(id){if(!S[id])id='debuter';for(const k in S)S[k].hidden=k!==id;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===id));$('#q').value='';filtrer('');history.replaceState(null,'','#'+id);}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)montrer(b.dataset.r);});
// recherche : cache les éléments [data-f] de la rubrique affichée qui ne contiennent pas le texte
function filtrer(t){t=t.trim().toLowerCase();const s=Object.values(S).find(x=>!x.hidden);if(!s)return;s.querySelectorAll('[data-f]').forEach(e=>{e.hidden=!!t&&!e.dataset.f.includes(t);});}
$('#q').addEventListener('input',e=>filtrer(e.target.value));
const tip=$('#tip');
function bulle(e,h){tip.innerHTML=h;tip.hidden=false;const r=e.currentTarget.getBoundingClientRect(),w=tip.offsetWidth,ht=tip.offsetHeight;let x=r.left+r.width/2-w/2,y=r.bottom+8;x=Math.max(6,Math.min(innerWidth-w-6,x));if(y+ht>innerHeight-6)y=r.top-ht-8;tip.style.left=x+'px';tip.style.top=Math.max(6,y)+'px';}

// ---------- bien débuter ----------
{const s=S.debuter;s.append(el('h2',null,'Bien débuter'),el('p','intro','Le chemin d’un nouveau joueur, pas à pas, du premier héros jusqu’au contenu de fin de jeu. Les captures viennent du jeu.'));
  const E=[
   ['titre','1 · Lance le jeu','Sur l’écran titre, clique sur <b>Jouer</b> (ou appuie sur Entrée), crée ton compte, puis accepte les conditions. Ta progression est gardée sur le serveur : tu la retrouves depuis n’importe quel ordinateur.'],
   ['heros','2 · Choisis ton premier héros','Quatre héros sont disponibles au départ : <b>Guerrier</b> (résistant, au corps à corps), <b>Mage</b> (dégâts de zone), <b>Archer</b> (longue portée) et <b>Prêtre</b> (soins). Tu pourras tous les jouer sur le même compte. Pour hésiter moins longtemps, regarde la rubrique <a href="#joues" onclick="montrer(\'joues\');return false">Héros joués</a>.'],
   ['village','3 · Découvre le Village','Le Village est une zone sûre. La <b>fontaine</b> te soigne (et sert à changer de serveur avec E). À droite l’<b>échoppe</b> du marchand, à gauche la <b>forge</b>, en bas le portail de ta <b>Maison</b> (tes coffres et ton parc de familiers), au sud les prés, l’étang et le pêcheur. Le <b>guide</b> te fait refaire le tutoriel quand tu veux.'],
   ['portail','4 · Passe le portail des Plaines Sauvages','Le grand portail violet, en haut du Village, mène aux Plaines : c’est là que tout se passe. Touche <b>E</b> pour entrer, touche <b>R</b> pour revenir au Village à tout moment (pense-y quand ta vie est basse).'],
   ['combat','5 · Apprends à te battre','Déplace-toi avec ZQSD, <b>maintiens le clic</b> pour tirer vers la souris, <b>Espace</b> lance la capacité de ton héros (elle coûte du mana) et <b>Maj</b> fait une esquive. Chaque monstre a sa propre attaque : apprends à les esquiver plutôt qu’à les encaisser. F et V boivent une potion de vie ou de mana.'],
   ['carte','6 · Avance zone par zone','L’île est faite d’anneaux : la plage sur le bord (niveaux 1 à 3), puis des zones de plus en plus dures jusqu’au centre (niveaux 18 à 20). Les <b>chemins de briques</b> te font courir plus vite. La touche <b>M</b> affiche la grande carte. Ne fonce pas vers le centre : monte de niveau et change d’équipement d’abord (tiers T0 à T6, la couleur de l’icône indique le tier).'],
   ['donjon','7 · Entre dans les donjons','En tuant des monstres, un <b>portail de donjon</b> s’ouvre parfois pendant 60 secondes : tout le monde peut y entrer. Au bout, un boss qui donne plus d’équipement, une potion de caractéristique (un bonus définitif pour ton héros) et, une fois sur cinq, sa <b>ressource de talisman</b>. Commence par le Terrier des Gobelins, sur la plage et dans les Plaines d’Émeraude.'],
   ['forge','8 · Améliore ton équipement à la forge','Le <b>forgeron</b> fond deux objets identiques en un objet +1 (jusqu’à +2) : +10 % de puissance par niveau. Au fond de la forge, la <b>table enchantée</b> transforme 10 ressources d’un même boss en talisman, un bonus qui profite à tous tes héros. Vends ce qui ne te sert pas au marchand.'],
   ['enclos','9 · Adopte un familier','Les monstres lâchent parfois un <b>œuf</b>. Porte-le à l’<b>éleveur</b>, près des enclos au sud du Village : il en sort un familier qui te suit et te donne un bonus. Trois familiers identiques et une croquette donnent un familier du rang au-dessus ; trois familiers dont tu ne veux plus se relancent en un nouveau.'],
   ['quetes','10 · Fais tes quêtes et ouvre ton cadeau du jour','Touche <b>J</b> : trois quêtes par jour et des quêtes de la semaine rapportent des pièces et de la Cursite. Le <b>bonus de connexion</b> donne un cadeau chaque jour pendant sept jours (anneau T6, Cursite, une Relique, un titre). Les <b>succès</b> (touche N) débloquent des titres.'],
   ['debloquer','11 · Débloque les autres héros','Un héros au <b>niveau 15</b> débloque le suivant : Guerrier → Porte-bouclier, Mage → Mystificateur, Archer → Assassin, Prêtre → Démoniste. On change de héros à l’autel du Village. À la mort, ton héros perd une partie de ses niveaux mais garde son équipement.'],
   ['boss','12 · Fin de jeu : les boss du centre','Tous les 20 monstres tués dans les Plaines, un boss apparaît au centre : le <b>Roi Bouffon</b> ou le <b>Béhémoth d’Obsidienne</b>. Vas-y à plusieurs. Les vaincre ouvre souvent le portail doré de l’<b>Observatoire Céleste</b>, où tombent les objets <b>Tier 7</b> et où le Dévoreur d’Étoiles donne une Relique à coup sûr.'],
   ['chronos','13 · Le sommet : l’Horloge Brisée','Les grands boss lâchent rarement une <b>Clef du Temps</b>. Elle ouvre l’Horloge Brisée, le donjon le plus dur, où attend <b>Chronos</b> : chaque victoire donne une Relique de Chronos, les meilleurs objets du jeu. Rejoins aussi une <b>guilde</b> pour le Raid du Dragon, et vise le <b>classement</b> (touche L).'],
   ['maison','14 · La vie du serveur : maison, ventes, amis','Ta <b>Maison</b> se meuble : au pupitre « Décoration », achète des meubles avec tes pièces, pose-les où tu veux, puis invite les autres à la visiter (clic sur un joueur → « Visiter sa maison ») et à y laisser un cœur. À l’échoppe, l’<b>hôtel des ventes</b> permet de vendre ton équipement aux autres joueurs au prix que tu fixes (5 % de taxe), et d’acheter le leur. Le bouton <b>Parrainage</b> récompense en Cursite le parrain et son filleul quand ce dernier atteint les niveaux 10 et 20. Chaque semaine, tout le serveur partage un <b>objectif commun</b> de monstres à tuer (+25 % d’expérience pour tous une fois atteint), et chaque dimanche le <b>tournoi de pêche</b> couronne la plus grosse prise.']];
  for(const [img,titre,txt] of E){const c=el('article','card etape');c.dataset.f=(titre+' '+txt.replace(/<[^>]+>/g,'')).toLowerCase();c.innerHTML='<div><h3>'+titre+'</h3><p>'+txt+'</p></div>';if(D.guide&&D.guide[img]){const f=el('figure'),im=el('img');im.src=D.guide[img];im.alt='Capture du jeu : '+titre.replace(/^\d+ · /,'');im.loading='lazy';f.append(im);c.append(f);}s.append(c);}
  s.append(el('p','intro','Tout le détail est dans les autres rubriques : <b>Monstres</b> pour savoir ce que chaque créature donne, <b>Donjons</b> pour savoir où trouver les portails, <b>Butin et taux</b> pour les pourcentages.'));}

// ---------- objets ----------
{const s=S.objets;s.append(el('h2',null,'Objets'),el('p','intro','Passe la souris (ou le doigt) sur une icône pour voir ses caractéristiques. Les objets vont du Tier 0 au Tier 6, puis viennent le Tier 7 d’obsidienne, les Reliques (turquoise) et les Reliques de Chronos (or).'));
  const ligne=(o,l)=>{const r=el('div','rowi');r.dataset.f=(o.type+' '+o.cls.join(' ')+' '+l.map(x=>x.n).join(' ')).toLowerCase();const n=el('div','n');n.innerHTML='<b>'+esc(o.type)+'</b><span>'+esc(o.cls.join(', ')||(o.slot==='anneau'?'Tous les héros':''))+'</span>';const ics=el('div','ics');
    for(const x of l){const d=el('div','ic');d.tabIndex=0;d.style.borderColor=x.tag[0]==='T'&&x.tag!=='T7'?'':x.col;const im=el('img');im.src=x.ic;im.alt=x.n;const i=el('i',null,x.tag==='Relique'?'UT':x.tag==='Chronos'?'⌛':x.tag);d.append(im,i);const h=x.tip;d.addEventListener('mouseenter',e=>bulle(e,h));d.addEventListener('focus',e=>bulle(e,h));d.addEventListener('mouseleave',()=>tip.hidden=true);d.addEventListener('blur',()=>tip.hidden=true);ics.append(d);}
    r.append(n,ics);return r;};
  const base=D.objets.filter(o=>o.fam==='base');
  for(const [slot,titre] of [['arme','Armes'],['capa','Spéciaux'],['armure','Armures'],['anneau','Anneaux']]){s.append(el('h3',null,titre));
    for(const o of base.filter(x=>x.slot===slot)){const l=o.l.slice();for(const a of D.objets)if((a.fam==='t7'||a.fam==='alt')&&a.base===o.k)l.splice(a.fam==='t7'?7:l.length,0,...a.l);s.append(ligne(o,l));}}
  s.append(el('h3',null,'Consommables'));const c=D.objets.filter(o=>o.fam==='conso');if(c.length)s.append(ligne({type:'Potions, œufs, clefs',cls:[],slot:'conso'},c.flatMap(o=>o.l)));}

// ---------- monstres ----------
// butin possible d'un monstre, avec la chance de chaque ligne (mêmes règles que le serveur)
function butinDe(m){const L=[],B=D.butin,p=v=>pct(v),don=D.donjons.find(d=>d.bk===m.k||d.bk2===m.k),dans=D.donjons.filter(d=>d.pool.includes(m.k)||d.bk===m.k||d.bk2===m.k||m.ou.includes(d.nom));
  if(m.tuto)return [['Expérience doublée, pas de butin','—']];
  if(m.loot&&m.drop){const n=m.boss?m.n:1,ti='T'+m.loot[0]+(m.loot[1]>m.loot[0]?' à T'+m.loot[1]:'');L.push(['Équipement '+ti+(n>1?' ('+n+' objets)':''),p(m.drop)]);
    for(const [nom,k] of [['Arme',0.4],['Spécial',0.2],['Armure',0.25],['Anneau',0.15]])L.push(['· '+nom+' '+ti,p(m.drop*k)]);L.push(['· chance de gagner un tier (max T6)',p(D.taux.plus1)]);}
  if(m.rel)L.push(['Relique (turquoise)',m.k==='devoreur'?'100 %':p(m.rel)]);
  if(m.k==='chronos')L.push(['Relique de Chronos (or)','100 %']);
  if(dans.some(d=>B.T7.includes(d.t)))L.push(['Objet Tier 7 d’obsidienne',p(D.taux.t7)]);
  L.push(['Potion de vie',p((m.boss?1:D.taux.potion)*0.6)],['Potion de mana',p((m.boss?1:D.taux.potion)*0.4)]);
  if(m.mid||B.GARANTIS.includes(m.k))L.push(['Potion de caractéristique (garantie)','100 %']);
  if(don&&B.DUN_POT[don.t]){const [st,ch]=B.DUN_POT[don.t];L.push(['Potion de '+(st==='*'?'caractéristique au hasard':(D.stats[st]||st).toLowerCase())+' en plus',p(ch)]);}
  if(m.k==='chronos')L.push(['2 à 3 potions de caractéristique','100 %']);else if(m.star||m.k==='devoreur')L.push(['1 à 2 potions de caractéristique','100 %']);
  if(m.ou.includes('Centre des Plaines (boss)'))L.push(['Potion de caractéristique','20 %']);
  if(m.z===5&&!m.boss)L.push(['Potion de caractéristique','0,8 %']);if(m.z===6&&!m.boss)L.push(['Potion de caractéristique','1,1 %']);
  if(don&&B.CLEF.includes(don.t))L.push(['Clef du Temps','1 %']);if(m.star)L.push(['Clef du Temps','10 %']);
  L.push(['Œuf de familier',p(D.taux.oeuf)]);
  if(m.or)L.push(['Pièces ('+Math.round(m.or[1]*1.3)+(m.or[2]>m.or[1]?' à '+Math.round(m.or[2]*1.3):'')+')',p(m.or[0])]);
  if(m.dun2)L.push(['Portail doré (Observatoire Céleste)',p(m.dun2)]);
  if(!m.boss&&m.z>=0){if(m.z<=1)L.push(['Portail : Terrier des Gobelins','3,6 %']);if(m.z===3||m.z===4)L.push(['Portail : donjon intermédiaire','1,5 %']);if(D.zones[m.z].dun)L.push(['Portail : grand donjon',p(D.zones[m.z].dun)]);}
  return L;}
function bulleButin(m){return '<b style="color:var(--gold)">'+esc(m.nom)+' · butin</b><span class="d">chance par monstre tué</span>'+butinDe(m).map(([a,b])=>'<div><span>'+esc(a)+'</span><span>'+b+'</span></div>').join('');}
function carteMon(m){const c=el('div','card mon'+(m.boss?' boss':''));c.tabIndex=0;c.style.cursor='help';c.addEventListener('mouseenter',e=>bulle(e,bulleButin(m)));c.addEventListener('focus',e=>bulle(e,bulleButin(m)));c.addEventListener('mouseleave',()=>tip.hidden=true);c.addEventListener('blur',()=>tip.hidden=true);c.dataset.f=(m.nom+' '+m.ou.join(' ')).toLowerCase();const im=el('img');im.src=m.ic;im.alt='';if(m.fr){im.dataset.a=m.ic;im.dataset.b=m.fr[0];im.dataset.c=m.fr[1];im.className='anim';}const b=el('div');
  let h='<h4>'+esc(m.nom)+(m.boss?' · boss':'')+'</h4><div class="sub">'+esc(m.ou.join(' · ')||'—')+'</div>';const kv=(a,v)=>{h+='<div class="kv"><span>'+a+'</span><span>'+v+'</span></div>';};
  kv('Points de vie',m.hp.toLocaleString('fr-FR'));kv('Dégâts par tir',m.dmg);if(m.arm)kv('Armure',pct(m.arm)+' de dégâts en moins');kv('Expérience',m.xp.toLocaleString('fr-FR'));
  if(m.loot&&m.drop)kv('Équipement',pct(m.drop)+' · T'+m.loot[0]+(m.loot[1]>m.loot[0]?' à T'+m.loot[1]:'')+(m.boss&&m.n>1?' · '+m.n+' objets':''));
  if(m.rel)kv('Relique',m.k==='devoreur'?'100 %':pct(m.rel)+' ('+sur(m.rel)+')');if(m.or)kv('Pièces',pct(m.or[0])+' · '+Math.round(m.or[1]*1.3)+(m.or[2]>m.or[1]?' à '+Math.round(m.or[2]*1.3):''));
  if(m.dun2)kv('Portail doré',pct(m.dun2));if(m.tir&&m.tir.length)kv('Attaque',m.tir.map(u=>'<img class="tir" src="'+u+'" alt="">').join(' '));b.innerHTML=h;c.append(im,b);return c;}
{const s=S.monstres;s.append(el('h2',null,'Monstres'),el('p','intro',D.monstres.length+' monstres et boss, animés comme en jeu (repos, puis attaque). Les boss ont un cadre doré. La ligne « Attaque » montre leurs projectiles. <b>Passe la souris sur un monstre pour voir tout ce qu’il peut donner, avec les pourcentages.</b>'));const vus=new Set();
  const bloc=(titre,l)=>{l=[...new Set(l)].filter(m=>m&&!vus.has(m.k));if(!l.length)return;l.forEach(m=>vus.add(m.k));s.append(el('h3',null,esc(titre)));const g=el('div','grid');l.forEach(m=>g.append(carteMon(m)));s.append(g);};
  const par=k=>D.monstres.find(m=>m.k===k);
  D.zones.forEach(z=>bloc(z.nom+' · '+z.niv,z.pool.map(par)));bloc('Boss du centre des Plaines',D.monstres.filter(m=>m.ou.includes('Centre des Plaines (boss)')));
  D.donjons.forEach(d=>bloc(d.nom,[...d.pool,d.bk,d.bk2].filter(Boolean).map(par).concat(D.monstres.filter(m=>m.ou.includes(d.nom)))));
  bloc('Autres',D.monstres.filter(m=>!m.ou.includes('Tutoriel')));bloc('Tutoriel',D.monstres);}

// ---------- zones ----------
{const s=S.zones;s.append(el('h2',null,'Zones des Plaines Sauvages'),el('p','intro','Les Plaines forment une île : la plage sur le bord, puis des zones de plus en plus dangereuses jusqu’au centre. Tous les 20 monstres tués, un boss du centre apparaît.'));
  const w=el('div','tablewrap'),t=el('table');t.innerHTML='<tr><th>Zone</th><th>Niveaux</th><th>Monstres</th><th>Portails de donjon</th></tr>';
  D.zones.forEach((z,i)=>{const tr=el('tr');tr.dataset.f=(z.nom+' '+z.pool.map(nomMon).join(' ')).toLowerCase();const p=i<=1?'Terrier des Gobelins : 3,6 % par monstre':i===3||i===4?'Donjons intermédiaires : 1,5 % par monstre':z.dun?'Grands donjons : '+sur(z.dun)+' par monstre':'—';
    tr.innerHTML='<td><span class="dot" style="background:'+z.col+'"></span>'+esc(z.nom)+'</td><td>'+esc(z.niv)+'</td><td>'+z.pool.map(k=>esc(nomMon(k))).join(', ')+'</td><td>'+p+'</td>';t.append(tr);});w.append(t);s.append(w);}

// ---------- donjons ----------
{const s=S.donjons;s.append(el('h2',null,'Donjons'),el('p','intro','Un portail reste ouvert 60 secondes. Tout le monde peut y entrer tant qu’il est ouvert.'));const g=el('div','grid');
  const acces=t=>t==='b'?'Portail : 3,6 % par monstre tué sur la Plage et dans les Plaines d’Émeraude':D.MID_DUN.includes(t)?'Portail : 1,5 % par monstre tué dans la Forêt des Murmures et le Canyon de Rouille (un des '+D.MID_DUN.length+' donjons intermédiaires au hasard)':D.REG_DUN.includes(t)?'Portail : '+sur(D.zones[5].dun)+' par monstre des Terres Brûlées, '+sur(D.zones[6].dun)+' par monstre des Terres Désolées (un des '+D.REG_DUN.length+' grands donjons au hasard)':t==='a'?'Portail doré : '+pct((D.monstres.find(m=>m.dun2)||{dun2:0}).dun2)+' à la mort d’un boss du centre des Plaines':t==='h'?'Clef du Temps : 1 % sur le boss d’un grand donjon, 10 % sur chaque gardien de l’Observatoire Céleste':t==='v'?'En pêchant en mer : 1 chance sur 250 à chaque poisson attrapé':'—';
  for(const d of D.donjons){const c=el('div','card');c.style.borderColor=d.col;c.dataset.f=(d.nom+' '+d.boss+' '+d.pool.map(nomMon).join(' ')).toLowerCase();
    c.innerHTML='<h4>'+esc(d.nom)+'</h4><div class="sub">'+esc(d.niv)+'</div><div class="kv"><span>Boss</span><span>'+esc([d.bk,d.bk2].filter(Boolean).map(nomMon).join(' et '))+'</span></div><div class="kv"><span>Monstres</span><span>'+esc(d.pool.map(nomMon).join(', ')||'—')+'</span></div>'+(d.mech?'<div class="kv"><span>Particularité</span><span>'+esc(d.mech)+'</span></div>':'')+'<div class="kv"><span>Accès</span><span>'+acces(d.t)+'</span></div>'+('ah'.includes(d.t)?'<div class="kv"><span>Butin spécial</span><span>Objets Tier 7 : '+pct(D.taux.t7)+' par monstre'+(d.t==='h'?' · une Relique de Chronos à chaque victoire':'')+'</span></div>':'');g.append(c);}
  s.append(g);}

// ---------- butin ----------
{const s=S.butin;s.append(el('h2',null,'Butin et taux'),el('p','intro','C’est le serveur qui tire le butin, pour chaque joueur qui a participé. Chaque monstre a sa propre chance de donner de l’équipement (voir la rubrique Monstres).'));
  const t=el('table');const L=[['Équipement','Selon le monstre. Le tier est tiré dans sa fourchette, avec '+pct(D.taux.plus1)+' de chance de gagner un tier (maximum T6).'],
    ['Type d’objet','40 % arme, 20 % spécial, 25 % armure, 15 % anneau. 55 % de chance que l’arme, le spécial ou l’armure soit pour ton héros.'],
    ['Potion de vie ou de mana',pct(D.taux.potion)+' sur un monstre, 100 % sur un boss (60 % vie, 40 % mana).'],

    ['Potion de caractéristique','Boss de donjon : garantie sur les grands boss, plus un bonus selon le donjon. Boss du centre : 20 %. Monstres des Terres Brûlées : 0,8 %. Monstres des Terres Désolées : 1,1 %.'],

  t.innerHTML='<tr><th>Quoi</th><th>Règle</th></tr>';for(const [a,b] of L){const tr=el('tr');tr.dataset.f=(a+' '+b).toLowerCase();tr.innerHTML='<td>'+a+'</td><td>'+b+'</td>';t.append(tr);}const w=el('div','tablewrap');w.append(t);s.append(w);}

// ---------- héros ----------
{const s=S.classes;s.append(el('h2',null,'Héros'),el('p','intro','Quatre héros au départ ; chacun débloque un autre héros au niveau 15.'));const g=el('div','grid');
  for(const c of D.classes){const d=el('div','card mon');d.dataset.f=(c.nom+' '+c.role).toLowerCase();const im=el('img');im.src=c.ic;im.alt='';const b=el('div');

{const s=S.poissons;s.append(el('h2',null,'Pêche'),el('p','intro','On pêche à l’étang du Village, au lac de sa maison et au bord de la mer. Attraper toutes les espèces donne le titre « Pêcheur maudit » (va voir le pêcheur au bout du ponton).'));
  for(const [site,titre] of [['lac','Lac et étang'],['mer','Mer des Plaines Sauvages']]){s.append(el('h3',null,titre));const g=el('div','grid');

// ---------- classement (lu en direct sur le serveur du jeu) ----------
{const s=S.classement;s.append(el('h2',null,'Classement'),el('p','intro','Le même classement qu’en jeu (touche L), mis à jour en direct : les 20 premiers de chaque catégorie.'));
  const CAT=[['or','Top Or','Pièces','Pièces actuellement possédées.'],['prestige','Top Prestige gagné','Prestige gagné','Tout le prestige gagné depuis le début par les morts définitives, tous héros confondus.'],['kills','Top Monstres tués','Monstres tués','Monstres tués depuis le début, tous héros confondus.'],['precision','Top Précision','Précision','Tirs qui touchent un monstre, depuis la création du héros actuel. 300 tirs minimum pour être classé.']];
  const tabs=el('div');tabs.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px';const note=el('p','intro'),w=el('div','tablewrap'),t=el('table');w.append(t);s.append(tabs,note,w);let data=null,cur='or';
  const nomC=k=>(D.classes.find(c=>c.k===k)||{nom:'?'}).nom,icC=k=>(D.classes.find(c=>c.k===k)||{ic:''}).ic;
  const rendre=()=>{tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===cur));const c=CAT.find(x=>x[0]===cur);note.textContent=c[3];t.innerHTML='<tr><th class="r">#</th><th>Joueur</th><th>Héros</th><th class="r">'+c[2]+'</th></tr>';
    const rows=data&&data[cur]||[];if(!rows.length){const tr=el('tr');tr.innerHTML='<td colspan="4" class="vide">'+(data?'Personne pour l’instant.':'Chargement…')+'</td>';t.append(tr);return;}
    rows.forEach((r,i)=>{const tr=el('tr');tr.dataset.f=String(r.n).toLowerCase();const v=Number(r.v)||0;tr.innerHTML='<td class="r" style="color:'+(i===0?'#ffd23f':i===1?'#dcd8e4':i===2?'#c88a52':'')+'">'+(i+1)+'</td><td>'+esc(r.n)+'</td><td><img src="'+icC(r.c)+'" alt="" style="width:22px;height:22px;vertical-align:middle;margin-right:6px">'+esc(nomC(r.c))+' '+(r.l|0)+'</td><td class="r">'+(cur==='precision'?v.toFixed(1).replace('.',',')+' %':v.toLocaleString('fr-FR'))+'</td>';t.append(tr);});};
  for(const c of CAT){const b=el('button','chip',c[1]);b.type='button';b.dataset.c=c[0];b.addEventListener('click',()=>{cur=c[0];rendre();});tabs.append(b);}
  const charger=()=>fetch('/top').then(r=>r.json()).then(j=>{data=j;rendre();}).catch(()=>{data={};note.textContent='Classement indisponible pour le moment.';});
  rendre();charger();setInterval(()=>{if(!s.hidden)charger();},30000);}
// ---------- héros les plus joués (lu en direct sur le serveur) ----------
{const s=S.joues;s.append(el('h2',null,'Héros les plus joués'),el('p','intro','Chaque compte possède tous les héros : on additionne donc les niveaux de chaque héros sur tous les comptes. Plus la barre est longue, plus le héros est joué et monté. Pratique pour choisir son premier héros.'));
  const zone=el('div','card');zone.innerHTML='<div class="vide">Chargement…</div>';const note=el('p','intro');note.style.marginTop='10px';s.append(zone,note);
  const charger=()=>fetch('/classes').then(r=>r.json()).then(j=>{const tot=Object.values(j.niv||{}).reduce((a,b)=>a+b,0);if(!tot){zone.innerHTML='<div class="vide">Pas encore de données.</div>';return;}
    const l=D.classes.map(c=>({c,n:(j.niv||{})[c.k]||0,h:(j.heros||{})[c.k]||0})).sort((a,b)=>b.n-a.n),max=l[0].n||1;zone.innerHTML='';
    for(const {c,n,h} of l){const r=el('div','barre');r.dataset.f=c.nom.toLowerCase();r.innerHTML='<img src="'+c.ic+'" alt=""><b>'+esc(c.nom)+'</b><div class="jauge"><i style="width:'+(n/max*100).toFixed(1)+'%"></i></div><span>'+(n/tot*100).toFixed(1).replace('.',',')+' %</span><small>'+n.toLocaleString('fr-FR')+' niveaux · '+h+' héros créés'+(h?' · niveau moyen '+(n/h).toFixed(1).replace('.',','):'')+'</small>';zone.append(r);}
    note.textContent=j.comptes+' comptes pris en compte · mis à jour toutes les 5 minutes.';}).catch(()=>{zone.innerHTML='<div class="vide">Indisponible pour le moment.</div>';});
  charger();setInterval(()=>{if(!s.hidden)charger();},300000);}
// animation des monstres : repos A, repos B, et de temps en temps l'image d'attaque
{let n=0;const reduit=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduit)setInterval(()=>{n++;if(S.monstres.hidden)return;document.querySelectorAll('img.anim').forEach((im,i)=>{const k=(n+i)%14;im.src=k>=12?im.dataset.c:(n%2?im.dataset.b:im.dataset.a);});},300);}
